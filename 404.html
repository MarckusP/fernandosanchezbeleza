<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página não encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #5D91B1;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        p {
            font-size: 18px;
            font-weight: 400;
            color: #ccc;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid #5D91B1;
            cursor: pointer;
        }

        .button-primary {
            background-color: #5D91B1;
            color: #fff;
        }

        .button-primary:hover {
            background-color: #4a7393;
            border-color: #4a7393;
        }

        .button-secondary {
            background-color: transparent;
            color: #5D91B1;
        }

        .button-secondary:hover {
            background-color: #5D91B1;
            color: #fff;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 80px;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }

            .button {
                padding: 12px 24px;
                font-size: 14px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Página não encontrada</h1>
        <p>Desculpe, a página que você procura não existe ou foi removida. Volte ao início ou entre em contato conosco.</p>
        <div class="button-group">
            <a href="/" class="button button-primary">Voltar ao início</a>
            <a href="https://wa.me/14076868511" target="_blank" class="button button-secondary">Falar no WhatsApp</a>
        </div>
    </div>
</body>
</html>
